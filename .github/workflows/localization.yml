name: Crowdin Action
on:
    workflow_dispatch:
        inputs:
            upload_translations:
                description: 'Should only be used on initial creation'
                required: true
                default: 'false'
                type: choice
                options:
                  - 'true'
                  - 'false'

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: crowdin action
        uses: crowdin/github-action@v2.7.0
        with:
          upload_sources: true
          upload_translations: ${{ github.event.inputs.upload_translations == 'true' }}
          download_translations: true
          localization_branch_name: crowdin_translations
          create_pull_request: true
          pull_request_title: 'New Crowdin translations'
          pull_request_body: 'New Crowdin pull request with translations'
          pull_request_base_branch_name: '1.20.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}